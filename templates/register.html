{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl">
  <h2 class="text-2xl font-bold mb-2 text-white">Open Account</h2>
  <p class="text-slate-400 text-sm mb-6">Sign up to get a simulated account with an instant $1,500 balance.</p>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Username</label>
      <input type="text" name="username" required class="w-full bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-lg text-white focus:outline-none focus:border-indigo-500">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
      <input type="password" name="password" required class="w-full bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-lg text-white focus:outline-none focus:border-indigo-500">
    </div>
    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition">Create Account</button>
  </form>

  <p class="text-xs text-center text-slate-400 mt-6">
    Already have an account? <a href="{{ url_for('login') }}" class="text-indigo-400 hover:underline">Login</a>
  </p>
</div>
{% endblock %}
