{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-8 bg-slate-900/90 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-xl">
  
  <div class="text-center mb-6">
    <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
      <i data-lucide="lock" class="w-6 h-6"></i>
    </div>
    <h2 class="text-xl font-bold text-white font-mono-tech">TERMINAL ACCESS</h2>
    <p class="text-xs text-slate-400 font-mono-tech mt-1">Authenticate as Customer or Federal Admin</p>
  </div>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-mono-tech uppercase text-slate-400 mb-1.5">Username or 10-Digit Account</label>
      <input type="text" name="identifier" required placeholder="e.g., admin or 8800000001"
             class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-400 px-4 py-2.5 rounded-xl text-white font-mono-tech text-sm focus:outline-none">
    </div>

    <div>
      <label class="block text-xs font-mono-tech uppercase text-slate-400 mb-1.5">Password or 4-Digit PIN</label>
      <input type="password" name="password" required placeholder="••••"
             class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-400 px-4 py-2.5 rounded-xl text-white font-mono-tech text-sm focus:outline-none">
    </div>

    <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-mono-tech font-bold text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-cyan-500/20">
      AUTHENTICATE SESSION
    </button>
  </form>

  <div class="mt-6 p-3 rounded-xl bg-slate-950 border border-slate-800 text-[11px] font-mono-tech text-slate-400 space-y-1">
    <div class="text-cyan-400 font-bold">DEFAULT SEEDED ACCESS:</div>
    <div>&bull; Admin: <span class="text-white">admin</span> / Password: <span class="text-white">admin123</span></div>
    <div>&bull; Default Customer PIN: <span class="text-white">1234</span> (when created by Admin)</div>
  </div>

</div>
{% endblock %}
